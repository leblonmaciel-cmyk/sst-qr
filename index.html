<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST QR | Inspeções Semanais</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{font-family:system-ui,-apple-system,Arial;color:#18283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#12344a;color:white;padding:20px}.top h1{margin:0;font-size:23px}.top small{opacity:.8}.wrap{max-width:1050px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;font-weight:650;background:#176b78;color:white}button.alt{background:#e1ebef;color:#17394b}button.danger{background:#a23b3b}.panel{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 12px #15324712;margin-bottom:15px}h2{margin:0 0 12px;font-size:20px}h3{margin:16px 0 8px}label{display:block;margin:12px 0 5px;font-weight:600;font-size:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #c9d4de;border-radius:8px;font:inherit}textarea{min-height:75px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.metric{background:#edf5f6;padding:14px;border-radius:10px}.metric b{font-size:28px;display:block}.muted{color:#607083;font-size:13px}.item{padding:13px 0;border-bottom:1px solid #e4eaf0}.item:last-child{border:0}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#e2eef0;font-size:12px}.warn{background:#fff0cd}.bad{background:#ffe0de}.good{background:#d9f2e5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.qrbox{display:inline-block;padding:16px;border:1px solid #ddd;background:white;margin:10px 0}.question{padding:13px 0;border-bottom:1px solid #e7edf2}.options{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.options label{font-weight:400;margin:0}.options input{width:auto}footer{text-align:center;padding:18px;color:#6d7884;font-size:12px}.hidden{display:none!important}@media print{.top,.tabs,.no-print,button,footer{display:none!important}body{background:white}.panel{box-shadow:none}.printonly{display:block!important}}.printonly{display:none}</style></head><body><header class="top"><div class="wrap" style="padding:0"><h1>🛡️ SST QR</h1><small>Inspeções semanais de Segurança do Trabalho • Protótipo local</small></div></header><main class="wrap"><nav class="tabs no-print"><button onclick="page('dashboard')">Painel</button><button onclick="page('cadastro')">Empresas e máquinas</button><button onclick="page('checklists')">Checklists</button><button onclick="page('inspecao')">Inspecionar</button><button onclick="page('dados')">Backup</button></nav><div id="app"></div></main><footer>Protótipo: dados armazenados apenas neste navegador. Não utilizar como registro oficial sem implantação segura.</footer><script>
const KEY='sstqr_v1';const defaults={companies:[{id:'c1',name:'Empresa Demonstração'}],machines:[{id:'m1',company:'c1',sector:'Corte',name:'Serra Circular 01',template:'t1'}],templates:[{id:'t1',name:'Máquinas — verificação geral',questions:['Proteções da máquina instaladas e íntegras?','Parada de emergência acessível e sem danos aparentes?','Cabos e componentes elétricos aparentes sem danos?','Área de trabalho limpa e desobstruída?','Há sinais de funcionamento anormal?']}],inspections:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(defaults))}catch(e){db=JSON.parse(JSON.stringify(defaults))};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('O navegador bloqueou o armazenamento local ou está sem espaço. Abra no Safari/Chrome e tente novamente.');return false}};const company=id=>db.companies.find(c=>c.id===id);const machine=id=>db.machines.find(m=>m.id===id);const template=id=>db.templates.find(t=>t.id===id);const weekStart=d=>{let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const thisWeek=()=>weekStart(new Date()).toISOString().slice(0,10);const doneThisWeek=id=>db.inspections.some(i=>i.machine===id&&i.week===thisWeek());function page(p,extra){history.replaceState({},'',location.pathname+(p==='inspecao'&&extra?'?machine='+encodeURIComponent(extra):''));const a=$('#app');if(p==='dashboard'){let done=db.machines.filter(m=>doneThisWeek(m.id)).length;let issues=db.inspections.filter(i=>i.issues.length);a.innerHTML=`<section class="panel"><h2>Painel semanal</h2><p class="muted">Semana iniciada em ${thisWeek()} • Indicadores demonstrativos locais</p><div class="grid"><div class="metric"><b>${db.machines.length}</b>Máquinas cadastradas</div><div class="metric"><b>${done}</b>Inspecionadas nesta semana</div><div class="metric"><b>${db.machines.length-done}</b>Pendentes</div><div class="metric"><b>${issues.length}</b>Inspeções com irregularidades</div></div></section><section class="panel"><h2>Equipamentos</h2>${db.machines.map(m=>`<div class="item"><strong>${esc(m.name)}</strong> <span class="tag ${doneThisWeek(m.id)?'good':'warn'}">${doneThisWeek(m.id)?'Inspeção realizada':'Pendente'}</span><div class="muted">${esc(company(m.company)?.name)} • ${esc(m.sector)}</div><div class="actions"><button onclick="page('inspecao','${m.id}')">Inspecionar</button><button class="alt" onclick="showQR('${m.id}')">QR Code</button></div></div>`).join('')||'<p>Nenhuma máquina cadastrada.</p>'}</section><section class="panel"><h2>Histórico recente</h2>${db.inspections.slice().reverse().slice(0,15).map(i=>`<div class="item"><b>${esc(machine(i.machine)?.name||'Máquina excluída')}</b> • ${new Date(i.date).toLocaleString('pt-BR')}<div class="muted">${esc(i.name)} (${esc(i.registration)}) • ${i.issues.length} ocorrência(s)</div></div>`).join('')||'<p>Sem inspeções.</p>'}</section>`}else if(p==='cadastro'){a.innerHTML=`<section class="panel"><h2>Cadastrar empresa</h2><form onsubmit="addCompany(event)"><label>Nome da empresa</label><input name="name" required maxlength="100"><div class="actions"><button>Adicionar empresa</button></div></form></section><section class="panel"><h2>Cadastrar máquina ou equipamento</h2><form onsubmit="addMachine(event)"><label>Empresa</label><select name="company" required>${db.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Setor</label><input name="sector" required maxlength="100"><label>Nome / identificação da máquina</label><input name="name" required maxlength="100"><label>Modelo de checklist</label><select name="template">${db.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><div class="actions"><button>Cadastrar máquina</button></div></form></section><section class="panel"><h2>Máquinas cadastradas</h2>${db.machines.map(m=>`<div class="item"><b>${esc(m.name)}</b> — ${esc(company(m.company)?.name)} / ${esc(m.sector)}<div class="actions"><button class="alt" onclick="showQR('${m.id}')">Gerar QR</button><button class="danger" onclick="removeMachine('${m.id}')">Excluir</button></div></div>`).join('')}</section>`}else if(p==='checklists'){a.innerHTML=`<section class="panel"><h2>Modelos de checklist</h2><p class="muted">Uma pergunta por linha. A última pergunta do modelo padrão trata de anormalidade: configure a resposta de risco ao criar o modelo definitivo.</p><form onsubmit="addTemplate(event)"><label>Nome do modelo</label><input name="name" required><label>Perguntas (uma por linha)</label><textarea name="questions" required rows="6" placeholder="A proteção está íntegra?&#10;A área está desobstruída?"></textarea><div class="actions"><button>Salvar modelo</button></div></form></section>${db.templates.map(t=>`<section class="panel"><h3>${esc(t.name)}</h3><ol>${t.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></section>`).join('')}`}else if(p==='inspecao'){let id=extra||new URLSearchParams(location.search).get('machine')||db.machines[0]?.id;let m=machine(id);if(!m){a.innerHTML='<section class="panel">Máquina não encontrada.</section>';return}let t=template(m.template);a.innerHTML=`<section class="panel"><h2>Inspeção semanal</h2><p><strong>${esc(m.name)}</strong><br><span class="muted">${esc(company(m.company)?.name)} • ${esc(m.sector)}</span></p>${doneThisWeek(id)?'<p class="tag warn">Já existe inspeção desta máquina nesta semana. Um novo envio será registrado separadamente.</p>':''}<form id="inspection" onsubmit="submitInspection(event,'${id}')"><label>Nome completo do funcionário</label><input name="name" required maxlength="100"><label>Matrícula</label><input name="registration" required maxlength="50">${(t?.questions||[]).map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q)}</b><div class="options"><label><input type="radio" name="q${i}" value="sim" required> Sim</label><label><input type="radio" name="q${i}" value="nao"> Não</label><label><input type="radio" name="q${i}" value="na"> N/A</label></div></div>`).join('')}<label>Observações e descrição de irregularidades</label><textarea name="notes" placeholder="Descreva a condição observada"></textarea><label>Fotografia (opcional; tamanho reduzido automaticamente)</label><input type="file" name="photo" accept="image/*" capture="environment"><p class="muted">Se houver risco grave e iminente, interrompa a atividade conforme o procedimento da empresa e comunique imediatamente o responsável. O envio do formulário não libera o uso da máquina.</p><button>Registrar inspeção neste navegador</button></form></section>`}else if(p==='dados'){a.innerHTML=`<section class="panel"><h2>Backup e dados</h2><p>Os dados deste protótipo ficam apenas neste navegador/dispositivo. Não há sincronização entre celulares, contas de usuário ou servidor.</p><div class="actions"><button onclick="exportData()">Exportar backup JSON</button><button class="alt" onclick="document.getElementById('import').click()">Importar backup</button><input class="hidden" id="import" type="file" accept="application/json" onchange="importData(event)"></div><p class="muted">Faça backup antes de limpar o navegador. Não utilize dados pessoais reais de funcionários em testes compartilhados.</p></section>`}}function addCompany(e){e.preventDefault();db.companies.push({id:uid(),name:e.target.elements["name"].value.trim()});save();page('cadastro')}function addMachine(e){e.preventDefault();let f=e.target;db.machines.push({id:uid(),company:f.elements["company"].value,sector:f.elements["sector"].value.trim(),name:f.elements["name"].value.trim(),template:f.elements["template"].value});save();page('cadastro')}function addTemplate(e){e.preventDefault();let f=e.target;db.templates.push({id:uid(),name:f.elements["name"].value.trim(),questions:f.elements["questions"].value.split('\n').map(x=>x.trim()).filter(Boolean)});save();page('checklists')}function removeMachine(id){if(confirm('Excluir máquina? O histórico permanecerá armazenado.')){db.machines=db.machines.filter(m=>m.id!==id);save();page('cadastro')}}function showQR(id){let m=machine(id);let url=new URL(location.href);url.search='?machine='+encodeURIComponent(id);let remote=/^https?:$/.test(url.protocol);$('#app').innerHTML=`<section class="panel"><h2>Etiqueta — ${esc(m.name)}</h2><p>${esc(company(m.company)?.name)} • ${esc(m.sector)}</p><div id="qr" class="qrbox"></div><p class="muted">${remote?'QR gerado com o endereço atual. Para funcionar em outros celulares, publique o sistema em HTTPS com banco de dados compartilhado.':'Arquivo local: não há endereço público. O QR só será útil após publicar o sistema em um endereço HTTPS.'}</p><p class="muted">${esc(url.href)}</p><div class="actions no-print"><button onclick="window.print()">Imprimir etiqueta</button><button class="alt" onclick="page('dashboard')">Voltar</button></div></section>`;if(window.QRCode&&remote)new QRCode($('#qr'),{text:url.href,width:190,height:190});else $('#qr').text('QR indisponível: publique em HTTPS e conecte o gerador de QR.')}function compress(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');let img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,900/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.5))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}async function submitInspection(e,id){e.preventDefault();let f=e.target,t=template(machine(id).template),answers=t.questions.map((q,i)=>f.elements['q'+i].value);let issues=answers.map((v,i)=>(v==='nao' && !(t.id==='t1'&&i===4))||(v==='sim'&&t.id==='t1'&&i===4)?i:-1).filter(i=>i>=0);let photo='';try{photo=await compress(f.elements["photo"].files[0])}catch(err){alert('Não foi possível processar a fotografia.');return}let record={id:uid(),machine:id,name:f.elements["name"].value.trim(),registration:f.elements["registration"].value.trim(),date:new Date().toISOString(),week:thisWeek(),answers,issues,notes:f.elements["notes"].value.trim(),photo};db.inspections.push(record);if(save()){alert('Inspeção salva neste navegador. '+issues.length+' possível(is) irregularidade(s) para revisão.');page('dashboard')}else db.inspections.pop()}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sstqr-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.companies)||!Array.isArray(x.machines)||!Array.isArray(x.templates)||!Array.isArray(x.inspections))throw Error();if(confirm('Substituir todos os dados locais pelos do arquivo?')){db=x;save();page('dashboard')}}catch(err){alert('Arquivo de backup inválido.')}};r.readAsText(f)}page(new URLSearchParams(location.search).has('machine')?'inspecao':'dashboard',new URLSearchParams(location.search).get('machine'));
</script></body></html>
